<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}pastebin{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0d0f0e;
  --bg2:      #111413;
  --bg3:      #181c1a;
  --border:   #1e2420;
  --border2:  #263028;
  --green:    #39d353;
  --green2:   #2ea043;
  --green3:   #196127;
  --dim:      #3a4a3e;
  --muted:    #6a8a6e;
  --text:     #cdd9c5;
  --text2:    #8fa888;
  --accent:   #58e06a;
  --warn:     #d4a017;
  --danger:   #c94f4f;
  --info:     #4a9eba;
  --radius:   2px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Scanline overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

a { color: var(--green); text-decoration: none; }
a:hover { color: var(--accent); text-decoration: underline; }

/* HEADER */
header {
  border-bottom: 1px solid var(--border2);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 24px;
  background: var(--bg2);
}
.logo {
  color: var(--accent);
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-decoration: none;
}
.logo::before { content: '> '; color: var(--muted); }
.logo:hover { text-decoration: none; color: var(--green); }
nav { display: flex; gap: 4px; margin-left: auto; }
.nav-btn {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted);
  font-family: inherit;
  font-size: 0.8rem;
  padding: 5px 12px;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all 0.15s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.nav-btn:hover { border-color: var(--green3); color: var(--green); background: rgba(57,211,83,0.05); text-decoration: none; }
.nav-btn.primary { border-color: var(--green3); color: var(--green); }
.nav-btn.primary:hover { background: rgba(57,211,83,0.1); }

/* MAIN */
main { flex: 1; padding: 24px; max-width: 1100px; width: 100%; margin: 0 auto; }

/* PROMPT line */
.prompt { color: var(--muted); font-size: 0.75rem; margin-bottom: 16px; }
.prompt .cmd { color: var(--green2); }
.prompt .arg { color: var(--text2); }

/* PASTE LIST */
.section-title {
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.paste-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 32px; }
.paste-row {
  display: grid;
  grid-template-columns: 120px 1fr 80px 90px 80px;
  gap: 12px;
  align-items: center;
  padding: 8px 12px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  transition: all 0.1s;
  font-size: 0.82rem;
}
.paste-row:hover { background: var(--bg3); border-color: var(--border); }
.paste-id { color: var(--green2); font-weight: 500; font-size: 0.78rem; }
.paste-title { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.paste-title.untitled { color: var(--dim); font-style: italic; }
.paste-lang { color: var(--info); font-size: 0.72rem; text-align: right; }
.paste-time { color: var(--muted); font-size: 0.72rem; text-align: right; }
.paste-ttl { font-size: 0.72rem; text-align: right; }
.paste-ttl.expires { color: var(--warn); }
.paste-ttl.never { color: var(--dim); }

/* PASTE VIEW */
.paste-header {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.paste-meta { flex: 1; }
.paste-meta h1 { font-size: 1rem; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.paste-meta h1::before { content: '# '; color: var(--dim); }
.meta-row { font-size: 0.75rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
.meta-row span { display: flex; gap: 4px; }
.meta-row .val { color: var(--text2); }
.paste-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.code-block {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  overflow: auto;
  position: relative;
}
.code-block pre {
  padding: 20px 20px 20px 60px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  line-height: 1.65;
  color: var(--text);
  counter-reset: line;
  white-space: pre;
  min-height: 200px;
}
.code-block pre .line {
  display: block;
  position: relative;
}
.code-block pre .line::before {
  counter-increment: line;
  content: counter(line);
  position: absolute;
  left: -44px;
  width: 32px;
  text-align: right;
  color: var(--dim);
  font-size: 0.72rem;
  user-select: none;
  line-height: inherit;
}
.copy-btn {
  position: absolute;
  top: 8px; right: 8px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  color: var(--muted);
  font-family: inherit;
  font-size: 0.72rem;
  padding: 4px 10px;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all 0.15s;
}
.copy-btn:hover { color: var(--green); border-color: var(--green3); }
.copy-btn.copied { color: var(--green); border-color: var(--green2); }

/* FORM */
.form-block {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 20px;
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.field label::before { content: '$ '; color: var(--dim); }
.field input, .field select, .field textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: inherit;
  font-size: 0.85rem;
  padding: 8px 10px;
  border-radius: var(--radius);
  outline: none;
  transition: border-color 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--green3);
}
.field textarea {
  min-height: 320px;
  resize: vertical;
  line-height: 1.6;
  font-size: 0.82rem;
}
.field select option { background: var(--bg2); }
.form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.form-actions { display: flex; gap: 8px; margin-top: 16px; }

/* BUTTONS */
.btn {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted);
  font-family: inherit;
  font-size: 0.8rem;
  padding: 7px 16px;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all 0.15s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { text-decoration: none; }
.btn-primary { border-color: var(--green3); color: var(--green); }
.btn-primary:hover { background: rgba(57,211,83,0.08); border-color: var(--green2); color: var(--accent); }
.btn-warn { border-color: #5a4010; color: var(--warn); }
.btn-warn:hover { background: rgba(212,160,23,0.08); }
.btn-danger { border-color: #5a1f1f; color: var(--danger); }
.btn-danger:hover { background: rgba(201,79,79,0.08); }
.btn-info { border-color: #1a3a4a; color: var(--info); }
.btn-info:hover { background: rgba(74,158,186,0.08); }

/* STATUS badge */
.badge {
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 2px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
}
.badge-active { background: rgba(57,211,83,0.12); color: var(--green2); border: 1px solid var(--green3); }
.badge-archived { background: rgba(50,50,50,0.4); color: var(--muted); border: 1px solid var(--border); }
.badge-expired { background: rgba(212,160,23,0.12); color: var(--warn); border: 1px solid #5a4010; }

/* EMPTY */
.empty { color: var(--dim); font-size: 0.8rem; padding: 16px 0; }
.empty::before { content: '// '; }

/* FOOTER */
footer {
  border-top: 1px solid var(--border);
  padding: 10px 24px;
  font-size: 0.7rem;
  color: var(--dim);
  display: flex;
  gap: 16px;
}
footer a { color: var(--dim); }
footer a:hover { color: var(--muted); }

/* FLASH */
.flash { padding: 8px 12px; border-radius: var(--radius); font-size: 0.8rem; margin-bottom: 16px; }
.flash-ok { background: rgba(57,211,83,0.08); border: 1px solid var(--green3); color: var(--green2); }

/* archived section toggle */
details summary {
  cursor: pointer;
  list-style: none;
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
  user-select: none;
}
details summary::-webkit-details-marker { display: none; }
details summary::before { content: '▶ '; color: var(--dim); font-size: 0.6rem; }
details[open] summary::before { content: '▼ '; }
details summary:hover { color: var(--text2); }
</style>
{% block head_extra %}{% endblock %}
</head>
<body>
<header>
  <a class="logo" href="/">paste.sh</a>
  <nav>
    <a href="/" class="nav-btn">~ inicio</a>
    <a href="/new" class="nav-btn primary">+ nuevo paste</a>
    <a href="/docs" class="nav-btn" target="_blank">⚙ api</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <span>paste.sh — autoalojado</span>
  <a href="/api/pastes">api: GET /api/pastes</a>
  <a href="/docs">swagger</a>
</footer>
<script>
function relTime(ts) {
  const diff = Math.floor(Date.now()/1000) - ts;
  if (diff < 60) return 'hace ' + diff + 's';
  if (diff < 3600) return 'hace ' + Math.floor(diff/60) + 'm';
  if (diff < 86400) return 'hace ' + Math.floor(diff/3600) + 'h';
  return 'hace ' + Math.floor(diff/86400) + 'd';
}
function ttlLeft(exp) {
  if (!exp) return '∞';
  const diff = exp - Math.floor(Date.now()/1000);
  if (diff <= 0) return 'expirado';
  if (diff < 3600) return Math.floor(diff/60) + 'm restantes';
  if (diff < 86400) return Math.floor(diff/3600) + 'h restantes';
  return Math.floor(diff/86400) + 'd restantes';
}
document.querySelectorAll('.rel-time').forEach(el => {
  el.textContent = relTime(parseInt(el.dataset.ts));
});
document.querySelectorAll('.ttl-left').forEach(el => {
  const v = ttlLeft(el.dataset.exp ? parseInt(el.dataset.exp) : null);
  el.textContent = v;
  if (v !== '∞' && v !== 'expired') el.classList.add('expires');
  if (v === 'expired') el.classList.add('expires');
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
